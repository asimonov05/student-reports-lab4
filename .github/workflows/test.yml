name: Bash tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install command-line dependencies
        run: sudo apt-get update && sudo apt-get install -y gawk shellcheck
      - name: Check Bash syntax and ShellCheck
        run: |
          for script in student-report student-gui reports.sh tests/*.sh; do
            bash -n "$script"
          done
          shellcheck -x student-report student-gui reports.sh tests/*.sh
      - name: Verify reports and GUI contract
        run: |
          bash tests/test.sh
          bash tests/gui-test.sh
      - name: Check supplied dataset
        run: |
          ./student-report attendance A-06-23 Пересдачеведение 4 10
          ./student-report retakes A-06-23 Пересдачеведение 1
          ./student-report first-pass Пересдачеведение
          ./student-report longest-names
          ./student-report yearly-best Пересдачеведение 1
